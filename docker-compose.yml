# Whole stack for `make dev`: Postgres, migrations, API and Caddy serving the
# web app on http://localhost:${PUBLIC_PORT}. Values come from .env.
name: familyshop

x-api-image: &api-image
  build: .
  image: familyshop/api:dev

services:
  postgres:
    # Keep in step with dbtest.Image in internal/platform/db/dbtest.
    image: postgres:19-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      # Postgres 18+ images keep data under a versioned subdirectory of
      # /var/lib/postgresql, so the volume is mounted at the parent.
      - pgdata:/var/lib/postgresql
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      # Only on localhost: for `make dev-api` and `make migrate-up` from the host.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    <<: *api-image
    entrypoint: ["/usr/local/bin/migrate", "up"]
    environment:
      MIGRATION_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *api-image
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://familyshop_app:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  caddy:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "${PUBLIC_PORT:-8080}:8080"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
